<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <style>
    .wheel {
  overflow: hidden;
}

.wheel-track {
  display: flex;
  gap: 40px;
}

.single {
  width: 320px;
  height: 420px;
  background: #eee;
  flex-shrink: 0;

  will-change: transform;
  transform-origin: center top;
}
  </style>
</head>
<body>
  
<section class="wheel">
    <div class="wheel-track">
        <div class="single">1</div>
        <div class="single">2</div>
        <div class="single">3</div>
        <div class="single">4</div>
        <div class="single">5</div>
    </div>
</section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollSmoother.min.js"></script>
  <script>
    gsap.registerPlugin()

const slides = gsap.utils.toArray(".single")

const multiplier = {
  rotate: 0.05,
  translate: 0.15
}

let ticking = false

function calculateWheel() {

  const center = window.innerWidth * 0.5

  slides.forEach((slide) => {

    const rect = slide.getBoundingClientRect()

    const slideCenter = rect.left + rect.width * 0.5

    const r = center - slideCenter

    let ty = Math.abs(r) * multiplier.translate - rect.width * multiplier.translate

    if (ty < 0) ty = 0

    const rotate = -r * multiplier.rotate

    const origin = r < 0 ? "left top" : "right top"

    gsap.set(slide, {
      y: ty,
      rotate: rotate,
      transformOrigin: origin
    })

  })
}

function update() {
  calculateWheel()
  ticking = false
}

function requestTick() {
  if (!ticking) {
    requestAnimationFrame(update)
    ticking = true
  }
}

window.addEventListener("scroll", requestTick)
window.addEventListener("resize", requestTick)

calculateWheel()
  </script>
</body>
</html>
