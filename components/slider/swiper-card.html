<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.js"></script>
  <style>
section {
  width: 100%;
  height: 100vh;
}

.carousel{
  overflow-x: clip;
}
.swiper{
  padding: 5rem 0;
  overflow: visible;  
}
.swiper-slide{
  width: 400px;
  background: transparent;
}
.single{
  position: relative;
  pointer-events: none;
  user-select: none;
  box-shadow: rgba(255, 255, 255, 0.1) 0px 1px 1px 0px inset, rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px;
  transition: all 0.1s;  
  border-radius: 24px;
}
.single .thumb {
  width: 100%;
  height: 500px;
  border-radius: 24px;
  overflow: hidden;
}
.single img{
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.single::after {
  content: '';
  display: block;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.7);
  position: absolute;
  top:0;
  left:0;
  border-radius: 24px;
  opacity: 0;
  transition: all 0.5s;
}

.swiper-slide-active .single {
  position: relative;
  
}
.swiper-slide-active .single::after{
  opacity: 1;
}

h1 {
  text-align: center;
  padding:100px 0;
  font-size: 50px;
  font-weight: 700;
}

  </style>
</head>
<body>
<section>
  <h1>세상을 밝히는 사랑의 손길,<br>
희망조약돌과 함께하는 맞춤형 나눔</h1>
<!-- 참고 : https://codepen.io/MorenoDiDomenico/pen/jOJovQg -->

</section>

<script>
const multiplier = {
    translate: .3,
    rotate: .02,
    minScale: 0.85,
    maxScale: 1
}

new Swiper('.swiper', {
    slidesPerView: 'auto',
    spaceBetween: 60,
    centeredSlides: true,
    loop: false,
    grabCursor: true,
    mousewheel: {
        invert: false, // 스크롤 방향 반전 여부
        thresholdDelta: 20, // 스크롤 감도
    },
})

function calculateWheel() {
    const slides = document.querySelectorAll('.single')
    slides.forEach((slide, i) => {
        const rect = slide.getBoundingClientRect()
        const r = window.innerWidth * .5 - (rect.x + rect.width * .5)
        let ty = Math.abs(r) * multiplier.translate - rect.width * multiplier.translate
        if (ty < 0) {
            ty = 0
        }
        //const scale = Math.abs(r) < rect.width * .5 ? 1.05 : 0.9  // 추가

        // 거리 비율에 따른 부드러운 스케일 (중앙=1.05, 멀어지면 0.9)
        const dist = Math.abs(r);
        const maxDist = window.innerWidth * 0.5; 
        const scale = Math.max(multiplier.minScale, multiplier.maxScale - (dist / maxDist) * 0.3);

        const transformOrigin = r < 0 ? 'center bottom' : 'center bottom'
        slide.style.transform = `translate(0, ${ty}px) rotate(${-r * multiplier.rotate}deg) scale(${scale})`  // 수정
        slide.style.transformOrigin = transformOrigin
    })
}

function raf() {
    requestAnimationFrame(raf)
    calculateWheel()
}
raf();

</script>
</body>
