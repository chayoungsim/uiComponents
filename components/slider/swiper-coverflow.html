<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="../../assets/css/style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.css"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.js"></script>
        <style>
            section {
                width: 100%;
                height: 100vh;
            }

            .carousel {
                overflow-x: clip;
            }
            .swiper {
                padding: 5rem 0;
                overflow: visible;
            }
            .swiper-slide {
                width: 20vw;
                height: 50rem;
                display: flex;
                flex-direction: column;
                justify-content: end;
                align-items: self-start;
            }
            .single {
                position: relative;
                pointer-events: none;
                user-select: none;
                transition: all 0.1s;
                border-radius: 24px;
                width: 100%;
                height: 100%;
            }
            .single .thumb {
                width: 100%;
                height: 100%;
                border-radius: 24px;
                overflow: hidden;
            }
            .single img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .single::after {
                content: "";
                display: block;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.7);
                position: absolute;
                top: 0;
                left: 0;
                border-radius: 24px;
                opacity: 0;
                transition: all 0.5s;
            }

            .swiper-slide-active .single {
                position: relative;
            }
            .swiper-slide-active .single::after {
                opacity: 1;
            }

            h1 {
                text-align: center;
                padding: 100px 0;
                font-size: 50px;
                font-weight: 700;
            }
        </style>
    </head>
    <body>
        <!-- 참고 : https://codepen.io/kristen17/pen/GRXgqaB -->
        <!-- 참고 : https://codepen.io/Megalovania/pen/mdQqgdv -->
        <!-- 참고 : https://codepen.io/MuzammalAhmed/pen/QwbBJmg -->
        <section>
            <h1>
                세상을 밝히는 사랑의 손길,<br />
                희망조약돌과 함께하는 맞춤형 나눔
            </h1>
            <div class="carousel">
                <div class="swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <div class="single">
                                <div class="thumb">
                                    <img src="https://picsum.photos/800/1200?random=1" alt="" />
                                </div>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <div class="single">
                                <div class="thumb">
                                    <img src="https://picsum.photos/800/1200?random=2" alt="" />
                                </div>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <div class="single">
                                <div class="thumb">
                                    <img src="https://picsum.photos/800/1200?random=3" alt="" />
                                </div>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <div class="single">
                                <div class="thumb">
                                    <img src="https://picsum.photos/800/1200?random=4" alt="" />
                                </div>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <div class="single">
                                <div class="thumb">
                                    <img src="https://picsum.photos/800/1200?random=5" alt="" />
                                </div>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <div class="single">
                                <div class="thumb">
                                    <img src="https://picsum.photos/800/1200?random=6" alt="" />
                                </div>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <div class="single">
                                <div class="thumb">
                                    <img src="https://picsum.photos/800/1200?random=7" alt="" />
                                </div>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <div class="single">
                                <div class="thumb">
                                    <img src="https://picsum.photos/800/1200?random=8" alt="" />
                                </div>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <div class="single">
                                <div class="thumb">
                                    <img src="https://picsum.photos/800/1200?random=9" alt="" />
                                </div>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <div class="single">
                                <div class="thumb">
                                    <img src="https://picsum.photos/800/1200?random=10" alt="" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <script>
            var swiper = new Swiper(".swiper", {
                effect: "coverflow",
                grabCursor: true,
                centeredSlides: true,
                coverflowEffect: {
                    rotate: 0,
                    stretch: 0,
                    depth: 100,
                    modifier: 5,
                    slideShadows: true,
                },
                mousewheel: {
                    thresholdDelta: 70,
                },
                loop: true,
                breakpoints: {
                    640: {
                        slidesPerView: 2,
                    },
                    768: {
                        slidesPerView: 1,
                    },
                    1024: {
                        slidesPerView: 2,
                    },
                    1560: {
                        slidesPerView: 3,
                    },
                },
            });
        </script>
    </body>
</html>
