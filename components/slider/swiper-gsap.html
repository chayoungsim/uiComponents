                transition: all 0.5s;

            }

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollSmoother.min.js"></script>

<script>
    const multiplier = {
        translate: 0.3,
        rotate: 0.02,
        minScale: 0.85,
        maxScale: 1,
    };

    const swiper = new Swiper(".swiper", {
        slidesPerView: "auto",
        spaceBetween: 60,
        centeredSlides: true,
        loop: false,
        grabCursor: true,        
    });

    const slides = document.querySelectorAll(".single");

    slides.forEach(slide => {
      slide.addEventListener('mouseenter', () => slide.dataset.hovered = 'true');
      slide.addEventListener('mouseleave', () => slide.dataset.hovered = 'false');
    });

    function calculateWheel() {
        
        slides.forEach((slide, i) => {
            const rect = slide.getBoundingClientRect(); 
            const r = window.innerWidth * 0.5 - (rect.x + rect.width * 0.5);
            
            let ty = Math.abs(r) * multiplier.translate - rect.width * multiplier.translate;
            if (ty < 0) ty = 0;

            const dist = Math.abs(r);
            const maxDist = window.innerWidth * 0.5;
            let scale = Math.max(
                multiplier.minScale,
                multiplier.maxScale - (dist / maxDist) * 0.3,
            );

            if (slide.dataset.hovered === 'true') {
                scale += 0.1; 
            }

            slide.style.transform = `translate(0, ${ty}px) rotate(${-r * multiplier.rotate}deg) scale(${scale})`;
            slide.style.transformOrigin = "center bottom";

            
        });
    }

    function raf() {
        requestAnimationFrame(raf);
        calculateWheel();
    }
    raf();


    gsap.registerPlugin(ScrollTrigger);
    let currentSlide = 0;
    const totalSlides = swiper.slides.length;
    const tl = gsap.timeline({
    scrollTrigger: {
        trigger: ".slider",
        pin: ".slider",
        start: "top top",
        end: "+=3000vh", // 스크롤 길이에 맞게 조정하세요
        scrub: true,
        //markers: true, // 배포 시 삭제
        onUpdate: (self) => {
            // 3. progress를 기반으로 인덱스 계산 후, 최대 인덱스 범위를 넘지 않도록 방어
            let updatedIndex = Math.round(self.progress * totalSlides);
            updatedIndex = Math.min(updatedIndex, totalSlides - 1); 

            if (updatedIndex !== currentSlide) {
                currentSlide = updatedIndex;
                swiper.slideTo(currentSlide);
            }
        }
    }
  });


</script>
