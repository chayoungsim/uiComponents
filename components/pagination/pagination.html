<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pagination</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/temp.css" />
  <script type="module" src="../../assets/js/common.js"></script>
</head>
<body>
  <div class="cards">
    <div class="card">
      <h2 class="card__title">pagination</h2>
      <div class="card__desc">

        <nav class="pagination" aria-label="페이지네이션">
          <ul>
            <li><a href="#" aria-label="첫 페이지" class="first">«</a></li>
            <li><a href="#" aria-label="이전 페이지" class="prev">‹</a></li>
            <li><strong aria-current="page">1</strong></li>
            <li><a href="#">2</a></li>
            <li><a href="#">3</a></li>
            <li><a href="#">4</a></li>
            <li><a href="#">5</a></li>
            <li><a href="#" aria-label="다음 페이지" class="next">›</a></li>
            <li><a href="#" aria-label="마지막 페이지" class="last">»</a></li>
          </ul>
        </nav>
        
      </div>
    </div>
  </div>
</body>
</html>
