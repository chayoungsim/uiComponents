<!DOCTYPE html>
<html lang="ko">
<head>
<style>
.hero-section {
  width: 100%;
  height: 500px;
  background: url('hero-image.jpg') center/cover;
  clip-path: url(#heroClip);
}
html, body{
  min-height: 100%;
}
</style>
</head>
<body>

<svg width="0" height="0">
  <defs>
    <clipPath id="maskRect">
      <rect x="10" y="10" width="200" height="150" rx="20"/>
    </clipPath>
  </defs>
</svg>

<div class="clipped-box">
  <img src="image.jpg" alt="이미지">
</div>

<style>
.clipped-box {
  clip-path: url(#maskRect);
}
</style>

</body>
</html>
