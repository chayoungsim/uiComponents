<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비주얼 축소 인터랙션 (Hero Shrink Interaction)</title>
    
    <!-- 폰트 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 스무스 스크롤(Lenis) 및 애니메이션(GSAP) 라이브러리 -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* 1. 히어로 핀(Pin) 컨테이너 */
        #hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* 배경색을 흰색으로 지정하여 비디오가 작아질 때 흰색 배경이 드러나도록 함 */
            background-color: #ffffff; 
            overflow: hidden;
        }

        /* 2. 비디오 래퍼 (이 부분이 작아짐) */
        .video-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            border-radius: 0px;
            overflow: hidden;
            /* GSAP 성능 최적화 */
            will-change: width, height, border-radius;
            z-index: 2;
        }

        /* 비디오 자체는 래퍼 안에서 꽉 차게 유지 */
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 비디오 위에 깔리는 어두운 오버레이 (텍스트 가독성용) */
        .video-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* 3. 초기 풀스크린 텍스트 (비디오가 커져 있을 때 보이는 텍스트) */
        .initial-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ffffff;
            z-index: 3;
            width: 100%;
            pointer-events: none;
        }

        .initial-text h1 {
            font-family: 'Anton', sans-serif;
            font-size: clamp(4rem, 10vw, 10rem);
            line-height: 1;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        /* 4. 비디오가 작아진 후 드러나는 배경 텍스트 */
        .revealed-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            z-index: 1; /* 비디오보다 뒤에 위치 (또는 디자인에 따라 비디오 위) */
            opacity: 0; /* 초기엔 숨김 */
        }
        
        .revealed-text h2 {
            font-family: 'Anton', sans-serif;
            font-size: clamp(6rem, 15vw, 15rem);
            color: #1a1a1a;
            line-height: 0.8;
            letter-spacing: -2px;
        }

        /* 스크롤 유도 인디케이터 */
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
        .scroll-line {
            width: 1px; height: 50px; background-color: rgba(255,255,255,0.3); overflow: hidden; position: relative;
        }
        .scroll-line::after {
            content: ''; position: absolute; top: -100%; left: 0; width: 100%; height: 100%; background-color: white;
            animation: drop 1.5s infinite ease-in-out;
        }
        @keyframes drop {
            0% { top: -100%; }
            50% { top: 100%; }
            100% { top: 100%; }
        }

        /* 스크롤 테스트를 위한 여백 섹션 */
        .dummy-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f4f4;
            font-size: 2rem;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <!-- 메인 헤더 (스크롤 시 고정 및 스타일 변경 처리 가능) -->
    <header class="fixed top-0 left-0 w-full p-6 flex justify-between z-50 mix-blend-difference text-white">
        <div class="font-bold text-xl tracking-widest cursor-pointer">LAW & ADVISORS</div>
        <div class="text-sm font-medium tracking-widest cursor-pointer">MENU</div>
    </header>

    <main>
        <!-- 1. 핀(Pin) 되어 작아지는 인터랙션 섹션 -->
        <section id="hero-container">
            
            <!-- 비디오가 작아졌을 때 뒤에서 나타나는 거대한 텍스트 -->
            <div class="revealed-text" id="revealed-text">
                <h2>SHIFT</h2>
                <p class="mt-4 font-medium text-gray-500">패러다임을 전환하는 새로운 법률 서비스</p>
            </div>

            <!-- 스크롤 시 작아지는 비디오 래퍼 -->
            <div class="video-wrapper" id="video-wrapper">
                <div class="video-overlay"></div>
                <!-- 샘플 비디오 (로컬 비디오로 교체 가능) -->
                <video src="https://cdn.pixabay.com/video/2021/08/11/84687-586715694_large.mp4" autoplay loop muted playsinline></video>
                
                <!-- 비디오가 100%일 때 보이는 중앙 텍스트 -->
                <div class="initial-text" id="initial-text">
                    <h1>LAW AND<br>ADVISORS</h1>
                </div>
            </div>

            <div class="scroll-indicator" id="scroll-indicator">
                SCROLL
                <div class="scroll-line"></div>
            </div>

        </section>

        <!-- 스크롤 진행을 확인하기 위한 더미 섹션 -->
        <section class="dummy-section">
            <div>
                <h3 class="text-4xl font-bold mb-4">NEXT SECTION</h3>
                <p class="text-lg text-gray-600">스크롤이 완료되면 이 섹션이 자연스럽게 올라옵니다.</p>
            </div>
        </section>
        <section class="dummy-section" style="background-color: #1a1a1a; color: white;">
            <div>ANOTHER CONTENT</div>
        </section>
    </main>

    <script>
        // 1. Lenis를 이용한 부드러운 관성 스크롤 설정 (선택사항이지만 고급스러운 느낌을 위해 필수)
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smooth: true
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // 2. GSAP ScrollTrigger 플러그인 등록
        gsap.registerPlugin(ScrollTrigger);

        // ScrollTrigger와 Lenis 동기화
        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((time) => {
            lenis.raf(time * 1000);
        });
        gsap.ticker.lagSmoothing(0, 0);

        // 3. 핀(Pin) & 축소(Shrink) 메인 애니메이션 타임라인
        const heroTl = gsap.timeline({
            scrollTrigger: {
                trigger: "#hero-container",
                start: "top top", // 컨테이너의 상단이 뷰포트 상단에 닿을 때 시작
                end: "+=150%",    // 뷰포트 높이의 1.5배만큼 스크롤하는 동안 애니메이션 진행
                pin: true,        // 화면 고정
                scrub: 1,         // 스크롤에 맞춰 애니메이션을 부드럽게 동기화 (1초 딜레이)
            }
        });

        // 애니메이션 시퀀스 설정
        heroTl
            // ① 비디오 래퍼 축소 및 모서리 둥글게 처리
            .to("#video-wrapper", {
                width: "35vw",          // 가로를 화면의 35%로 축소 (원하는 크기로 조절)
                height: "55vh",         // 세로를 화면의 55%로 축소
                borderRadius: "30px",   // 둥근 모서리 추가
                ease: "power1.inOut"
            }, 0) // '0'은 타임라인 시작점과 동시에 실행함을 의미
            
            // ② 초기 텍스트 및 스크롤 인디케이터 서서히 사라짐
            .to(["#initial-text", "#scroll-indicator"], {
                opacity: 0,
                scale: 0.9,
                duration: 0.3,
                ease: "power1.out"
            }, 0)

            // ③ 비디오가 작아지면서 뒤에 있던 배경 텍스트(SHIFT)가 드러남
            .to("#revealed-text", {
                opacity: 1,
                y: -20, // 살짝 위로 올라오는 효과
                duration: 0.5,
                ease: "power2.out"
            }, 0.2); // 비디오 축소가 조금 진행된 시점(0.2)부터 나타남
            
    </script>
</body>
</html>
